spring:
  application.name: pulse-be
  datasource:
    url: jdbc:h2:mem:pulse;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: create-drop # 로컬·테스트용: 앱/테스트가 끝나면 스키마와 데이터를 지운다
    open-in-view: false
  h2.console:
    enabled: true # 로컬에서 DB를 눈으로 확인하는 용도 (/h2-console)
    path: /h2-console
  jackson:
    time-zone: Asia/Seoul

pulse:
  cors:
    allowed-origin-patterns: '*' # 허용할 Origin 패턴(쉼표로 여러 개). 로컬 기본은 모두 허용, 배포 때 프런트 도메인으로 좁힌다
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum!!} # 개발용 기본값. prod 프로필은 환경변수를 필수로 요구
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  alert:
    base-threshold: 25 # 평소 대비 bpm 차이 기준
    dismiss-step: 5
    max-threshold: 45
